<form [formGroup]="pageForm" class="space-y-6">

  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">

    <!-- Latitude -->
    <div>

      <label class="mb-2 block font-medium text-gray-700 dark:text-gray-300">
        Latitude
      </label>

      <input type="number"
             step="any"
             formControlName="latitude"
             class="w-full rounded-lg border border-gray-300 px-4 py-2
                    focus:border-indigo-500 focus:outline-none">

      @if (pageForm.get('latitude')?.touched &&
      pageForm.get('latitude')?.invalid) {

      <p class="mt-1 text-sm text-red-500">
        Latitude must be between -90 and 90.
      </p>

      }

    </div>

    <!-- Longitude -->
    <div>

      <label class="mb-2 block font-medium text-gray-700 dark:text-gray-300">
        Longitude
      </label>

      <input type="number"
             step="any"
             formControlName="longitude"
             class="w-full rounded-lg border border-gray-300 px-4 py-2
                    focus:border-indigo-500 focus:outline-none">

      @if (pageForm.get('longitude')?.touched &&
      pageForm.get('longitude')?.invalid) {

      <p class="mt-1 text-sm text-red-500">
        Longitude must be between -180 and 180.
      </p>

      }

    </div>

    <!-- Button -->
    <div class="flex items-end">

      <button type="button"
              (click)="setLocation()"
              class="w-full rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white hover:bg-indigo-700">

        Set Location

      </button>

    </div>

  </div>

</form>

<!-- Map -->
<div class="mt-6 h-[500px] w-full overflow-hidden rounded-xl shadow-lg">

  <iframe [src]="mapUrl"
          width="100%"
          height="100%"
          style="border:0"
          loading="lazy"
          allowfullscreen>
  </iframe>

</div>
