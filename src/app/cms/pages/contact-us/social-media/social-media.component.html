<div class="space-y-6">

  <!-- Header -->
  <div class="flex flex-col gap-4 px-6 py-3  md:flex-row md:items-center md:justify-between">

    <div>

      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
        Social Media
      </h2>

      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        Manage social media links displayed on the website.
      </p>

    </div>


    <!-- Add Button -->
    <button type="button"
            (click)="openAddModal()"
            class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 font-medium text-white transition hover:bg-indigo-700">

      <i class="fa-solid fa-plus"></i>

      Add Social Media

    </button>

  </div>


  <!-- Table Card -->
  <div class="overflow-hidden  border border-gray-200 bg-white shadow-sm
              dark:border-slate-700 dark:bg-slate-900">

    <div class="overflow-x-auto">

      <table class="w-full text-left">

        <!-- Header -->

        <thead class="bg-gray-50 dark:bg-slate-800">

          <tr>

            <!-- Icon -->

            <th class="px-6 py-4 text-xs font-semibold uppercase
                       tracking-wider text-gray-500">

              Icon

            </th>


            <!-- URL -->

            <th class="px-6 py-4 text-xs font-semibold uppercase
                       tracking-wider text-gray-500">

              URL

            </th>


            <!-- Action -->

            <th class="px-6 py-4 text-right text-xs font-semibold uppercase
                       tracking-wider text-gray-500">

              Action

            </th>

          </tr>

        </thead>


        <!-- Body -->

        <tbody>

          @for (
          item of socialMedia() | paginate:{itemsPerPage:itemsPerPage(),currentPage:page()};
          track item.id
          ) {

          <tr class="border-t border-gray-200 transition
                     hover:bg-gray-50
                     dark:border-slate-700
                     dark:hover:bg-slate-800">


            <!-- Icon -->

            <td class="px-6 py-4">

              <div class="flex h-12 w-12 items-center justify-center
                          rounded-xl bg-indigo-100
                          dark:bg-indigo-900">

                <i [class]="item.icon"
                   class="text-xl text-indigo-600
                         dark:text-indigo-300">
                </i>

              </div>

            </td>


            <!-- URL -->

            <td class="px-6 py-4">

              <a [href]="item.link"
                 target="_blank"
                 rel="noopener noreferrer"
                 class="font-medium text-indigo-600 hover:underline
                       dark:text-indigo-400">

                {{ item.link }}

              </a>

            </td>


            <!-- Actions -->

            <td class="px-6 py-5">

              <div class="flex justify-end gap-3">


                <!-- Edit -->

                <button type="button"
                        (click)="editSocialMedia(item)"
                        class="rounded-lg border border-amber-200
                         bg-amber-50 p-2 text-amber-600
                         transition hover:bg-amber-100
                         dark:border-amber-900
                         dark:bg-amber-950
                         dark:text-amber-400">

                  <svg xmlns="http://www.w3.org/2000/svg"
                       fill="none"
                       viewBox="0 0 24 24"
                       stroke-width="1.8"
                       stroke="currentColor"
                       class="h-5 w-5">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M16.862 4.487a2.1 2.1 0 113.03 2.899L8.25 19.5 3 21l1.5-5.25L16.862 4.487z" />

                  </svg>

                </button>


                <!-- Delete -->

                <button type="button"
                        (click)="deleteSocialMedia(item)"
                        class="rounded-lg border border-red-200
                         bg-red-50 p-2 text-red-600
                         transition hover:bg-red-100
                         dark:border-red-900
                         dark:bg-red-950
                         dark:text-red-400">

                  <svg xmlns="http://www.w3.org/2000/svg"
                       fill="none"
                       viewBox="0 0 24 24"
                       stroke-width="1.8"
                       stroke="currentColor"
                       class="h-5 w-5">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M6 7h12M9 7V4h6v3m-8 0l1 13h8l1-13" />

                  </svg>

                </button>

              </div>

            </td>

          </tr>

          }

          @empty {

          <tr>

            <td colspan="4"
                class="px-6 py-12 text-center
                     text-gray-500 dark:text-gray-400">

              <i class="fa-solid fa-share-nodes mb-3 block text-4xl">
              </i>

              No social media links available.

            </td>

          </tr>

          }

        </tbody>

      </table>
      <!-- Footer -->

      <div class="mt-6 flex flex-col justify-between gap-4 border-t border-gray-200 px-5 pb-4 pt-4 md:flex-row md:items-center dark:border-slate-700">

        <!-- Page Size -->

        <div class="flex items-center gap-3">

          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">

            Items per page

          </label>

          <select [ngModel]="itemsPerPage()"
                  (ngModelChange)="itemsPerPage.set(+$event);page.set(1)"
                  class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-700 shadow-sm focus:border-indigo-500 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-white">

            @for(size of pageSizeOptions;track size){

            <option [value]="size">

              {{size}}

            </option>

            }

          </select>

        </div>

        <!-- Pagination -->

        <pagination-controls (pageChange)="page.set($event)">
        </pagination-controls>

      </div>

    </div>

  </div>

</div>


<!-- Modal -->
@if (showModal()) {

<app-social-media-modal [socialMedia]="selectedSocialMedia()"
                        [socialMediaList]="socialMedia()"
                        (save)="saveSocialMedia($event)"
                        (close)="closeModal()">

</app-social-media-modal>

}
