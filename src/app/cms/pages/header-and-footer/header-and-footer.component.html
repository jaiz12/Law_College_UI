<div class="flex flex-col md:flex-row min-h-[600px] overflow-hidden rounded-2xl border border-gray-200 bg-white shadow dark:border-slate-700 dark:bg-slate-900">

  <!-- Sidebar Navigation -->
  <aside class="w-full md:w-64 shrink-0 border-b md:border-b-0 md:border-r border-gray-200 bg-gray-50/50 dark:border-slate-700 dark:bg-slate-800/50">
    <nav class="flex flex-row md:flex-col overflow-x-auto md:overflow-x-visible p-3 gap-1">

      <!-- Logo and Title -->
      <button type="button"
              (click)="activeTab.set('logo-and-title')"
              [ngClass]="activeTab() === 'logo-and-title'
                ? 'bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 font-semibold'
                : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-slate-700/50 dark:hover:text-white'"
              class="flex items-center gap-3 whitespace-nowrap rounded-xl px-4 py-3 text-sm transition text-left">
        <i class="fa-solid fa-heading text-base"></i>
        <span>Logo and Title</span>
      </button>

      <!-- Contact Details -->
      <button type="button"
              (click)="activeTab.set('contact')"
              [ngClass]="activeTab() === 'contact'
                ? 'bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 font-semibold'
                : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-slate-700/50 dark:hover:text-white'"
              class="flex items-center gap-3 whitespace-nowrap rounded-xl px-4 py-3 text-sm transition text-left">
        <i class="fa-solid fa-address-book text-base"></i>
        <span>Contact Details</span>
      </button>

      <!-- Important Links -->
      <button type="button"
              (click)="activeTab.set('links')"
              [ngClass]="activeTab() === 'links'
                ? 'bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 font-semibold'
                : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-slate-700/50 dark:hover:text-white'"
              class="flex items-center gap-3 whitespace-nowrap rounded-xl px-4 py-3 text-sm transition text-left">
        <i class="fa-solid fa-link text-base"></i>
        <span>Important Links</span>
      </button>

      <!-- College Map -->
      <button type="button"
              (click)="activeTab.set('map')"
              [ngClass]="activeTab() === 'map'
                ? 'bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 font-semibold'
                : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-slate-700/50 dark:hover:text-white'"
              class="flex items-center gap-3 whitespace-nowrap rounded-xl px-4 py-3 text-sm transition text-left">
        <i class="fa-solid fa-location-dot text-base"></i>
        <span>College Map</span>
      </button>

      <!-- Social Media -->
      <button type="button"
              (click)="activeTab.set('social')"
              [ngClass]="activeTab() === 'social'
                ? 'bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 font-semibold'
                : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-slate-700/50 dark:hover:text-white'"
              class="flex items-center gap-3 whitespace-nowrap rounded-xl px-4 py-3 text-sm transition text-left">
        <i class="fa-solid fa-share-nodes text-base"></i>
        <span>Social Medias</span>
      </button>

    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 overflow-y-auto">
    @switch (activeTab()) {
    @case ('logo-and-title') {
    <app-logo-and-title></app-logo-and-title>
    }
    @case ('contact') {
    <app-contact-us-details></app-contact-us-details>
    }
    @case ('links') {
    <app-important-links></app-important-links>
    }
    @case ('map') {
    <app-google-map></app-google-map>
    }
    @case ('social') {
    <app-social-media></app-social-media>
    }
    }
  </main>

</div>
